# The URL the site will be built for
base_url = "https://synthesizer.garden"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Generate rss/atom feeds
generate_feeds = true
feed_filenames = ["rss.xml"]
author = "synthesizer.garden"
title = "Synthesizer Garden"
description = "An organic directory of electronic musical instruments"

taxonomies = [
    {name = "tags", feed = true}
]

[slugify]
paths = "on"
taxonomies = "on"

[extra]
# Put all your custom variables here
thumb_height = 1024
thumb_width = 1024
thumb_op = "fit"
